name: Update Ocean Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-ocean-data
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set deployed site URL
        shell: bash
        run: |
          repo_name="${{ github.event.repository.name }}"
          owner="${{ github.repository_owner }}"
          if [ "$repo_name" = "${owner}.github.io" ]; then
            echo "DIGITAL_BALTIC_SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          else
            echo "DIGITAL_BALTIC_SITE_URL=https://${owner}.github.io/${repo_name}" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Probe deployed ocean manifest
        env:
          DIGITAL_BALTIC_SITE_URL: ${{ env.DIGITAL_BALTIC_SITE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          site_url = os.environ["DIGITAL_BALTIC_SITE_URL"].rstrip("/")
          manifest_url = f"{site_url}/data/ocean/manifest.json?source=workflow-probe"
          print(f"Probing deployed ocean manifest: {manifest_url}")
          request = urllib.request.Request(
              manifest_url,
              headers={
                  "User-Agent": "Digital-Baltic-Workflow-Probe/1.0",
                  "Accept": "application/json",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode("utf-8"))
                  conditions = payload.get("conditions", [])
                  available = {item.get("id"): bool(item.get("available")) for item in conditions}
                  print(f"Manifest fetch succeeded with {len(conditions)} conditions")
                  print(f"Available flags: {available}")
          except urllib.error.HTTPError as exc:
              print(f"Manifest probe failed with HTTP {exc.code}")
          except urllib.error.URLError as exc:
              print(f"Manifest probe failed with URL error: {exc}")
          PY

      - name: Update Copernicus assets
        env:
          COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          DIGITAL_BALTIC_SITE_URL: ${{ env.DIGITAL_BALTIC_SITE_URL }}
        run: python scripts/update_copernicus.py

      - name: Build static site
        run: python scripts/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
